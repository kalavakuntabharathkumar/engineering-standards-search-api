spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/standards}
    username: ${SPRING_DATASOURCE_USERNAME:standards}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  application:
    name: engineering-standards-api
server:
  port: 8080
